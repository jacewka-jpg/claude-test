<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wizytówka</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --card: #1f2937;
        --text: #f9fafb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --border: #374151;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 1.6rem; }
    .role { margin: 4px 0 20px; color: var(--muted); }
    .bio { margin: 0 0 24px; line-height: 1.5; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    li { padding: 10px 0; border-bottom: 1px solid var(--border); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">JK</div>
    <h1>Jan Kowalski</h1>
    <p class="role">Web Developer</p>
    <p class="bio">Tworzę proste, szybkie i dostępne strony internetowe.</p>
    <ul>
      <li>📧 <a href="mailto:jan.kowalski@example.com">jan.kowalski@example.com</a></li>
      <li>📞 <a href="tel:+48123456789">+48 123 456 789</a></li>
      <li>🌐 <a href="https://example.com">example.com</a></li>
      <li>📍 Warszawa, Polska</li>
    </ul>
  </main>
</body>
</html>
